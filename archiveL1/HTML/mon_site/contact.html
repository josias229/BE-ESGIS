				</ul>
			</div>
		</nav>
		
	</header>

	<section id="contact">
		<h3>Contactez-nous en remplissant ce formulaire</h3>
		<form method="POST">
			<label for="nom">Nom: </label>
			<input style="width: 300px; height: 30px;" type="text" placeholder="Votre nom" id="nom" name="" required><br>

			<label  for="prenom">Prénoms: </label>
			<input style="width: 300px; height: 30px;" type="text" placeholder="Votre prénom" id="prenom" name="" required><br>

			<label for="age">Age: </label>
			<input style="width: 300px; height: 30px;" type="number" placeholder="Votre Age" min="15" id="age" name="" required><br>

			<label for="mail">Email: </label>
			<input style="width: 300px; height: 30px;" type="email" placeholder="Votre adresse mail" id="mail" name="" required><br>

			<label for="telephone">Téléphone: </label>
			<input style="width: 300px; height: 30px;" type="tel" placeholder="Numéro de téléphone(facultatif)" id="telephone" name=""><br>

			<label for="url">URL: </label>
			<input style="width: 300px; height: 30px;" type="url" placeholder="Lien vers votre profil(facultatif)" id="url" name=""><br>

			<label for="sujet">Sujet :</label>
			<select style="width: 300px; height: 30px;" id="sujet">
				<option value=""></option>
				<option value="Achats">Achats</option>
				<option value="Stage">Stage</option>
				<option value="Renseignements">Renseignements</option>
				<option value="Autres">Autres</option>
			</select><br>

			<h4>Vous contactez par :</h4>
			<label for="tel2">Téléphone: </label>
			<input type="radio" id="tel2" name="contacter" >

			<label for="tel3">Email: </label>
			<input type="radio" id="tel3" name="contacter" ><br>

			<h4>S'inscrire à une newsletter :</h4>
			<label for="news1">Oui</label>
			<input type="checkbox" name="news" id="news1">

			<label for="news2">Non</label>
			<input type="checkbox" name="news" id="news2">

			<h4>Votre message ou demande</h4>
			<textarea cols="50" rows="10">	
			</textarea>
			<br>

			<label for="date">Date limite de disponibilité </label>
			<input style="width: 300px; height: 30px;" type="date" id="date" name=""><br>

			<label for="heure"> Heure préférée de contact </label><br>
			<input style="width: 300px; height: 30px;" type="time" id="heure" name=""><br>

			<div id="btn">
				<div id="send">
					<input type="submit" value="Envoyer" name="">
				</div>
				<div id="reinit">
					<input type="reset" value="Réinitialiser" name="">
				</div>
			</div>

			<input style="width: 400px; height: 50px;" disabled type="text" name="">
		</form>
	</section>
