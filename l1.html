            <div class="flex items-center justify-center w-8 h-8 rounded-full bg-slate-100 group-hover:bg-slate-200 smooth-transition">

        <div class="flex items-center gap-2">
            <nav class="flex items-center bg-white border border-brand-border rounded p-0.5 text-xs font-semibold" aria-label="Niveaux">
